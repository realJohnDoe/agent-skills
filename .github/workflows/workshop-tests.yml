name: Workshop tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npx tsc
      - run: node --test 'skills/**/*.test.ts' 'tools/**/*.test.ts'

  # Lints every workflow, including the shell in `run:` blocks (shellcheck is on the
  # runner). Several workflows are called from other repos, and many of their paths only
  # run in production, so mistakes are cheaper to catch here.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
