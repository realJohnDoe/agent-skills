# Deploys the workshop board to GitHub Pages: the page from main, board.json from the
# workshop-board branch. Runs when main changes the page, when started by hand
# (Actions > Deploy board > Run workflow), and from the workshop-board branch's
# deploy.yml (template: skills/dispatcher/board/deploy.yml) after each dispatcher push.
name: Deploy board

on:
  push:
    branches: [main]
    paths:
      - skills/dispatcher/board/**
      - .github/workflows/deploy-board.yml
  workflow_dispatch:
  workflow_call:

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          ref: workshop-board
          path: pushed
      - name: Assemble the site
        run: |
          mkdir _site
          cp skills/dispatcher/board/{index.html,board.css,render.js,banner.jpg,favicon.ico,favicon-32.png,apple-touch-icon.png,manifest.webmanifest,icon-192.png,icon-512.png,icon-maskable-512.png} _site/
          cp pushed/board.json _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
