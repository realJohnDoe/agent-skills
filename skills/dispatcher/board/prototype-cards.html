<!doctype html>
<!-- PROTOTYPE, throwaway. Question: how should the board show issues AND their PRs so the two are easy to tell apart?
     Two variants (A chosen by the user, B explores the PR stages), switchable with ?variant=A|B or the ←/→ keys. Octicons inline. Mock data, no board.json.
     Open via any static server from this directory (or double-click: it only needs board.css). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board card prototype</title>
<link rel="stylesheet" href="board.css">
<style>
  body { padding-top: 24px; padding-bottom: 96px; }
  main { max-width: 1080px; margin: 0 auto; }
  :root { --issue: #6fd38a; --pr: #b99cff; }
  /* Octicons (16px, fill currentColor) */
  .ic { width: 14px; height: 14px; flex: none; fill: currentColor; vertical-align: -2px; }
  .k { display: inline-flex; align-items: center; gap: 5px; font: 700 11px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
  .k.issue { color: var(--issue); } .k.pr { color: var(--pr); }
  .ck { font: 11px var(--f-mono); display: inline-flex; align-items: center; gap: 4px; }
  .ck.green { color: var(--ok); } .ck.red { color: var(--bad); } .ck.pending { color: var(--lamp); }
  a.t { text-decoration: none; font-weight: 700; overflow-wrap: anywhere; } a.t:hover { text-decoration: underline; }
  .why { color: var(--muted); font-size: 13px; }
  .none { color: var(--muted); font: italic 12px var(--f-body); }

  .kc { position: relative; padding: 10px 12px 10px 14px; display: grid; gap: 7px; align-content: start; border: 1px solid #000; background: var(--glass); border-radius: 4px; box-shadow: inset 3px 0 0 var(--edge), inset 0 0 0 1px var(--holo-dim); }
  .kc.issue { --edge: var(--issue); } .kc.pr { --edge: var(--pr); }
  .kc .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .kc.pr .t { display: flex; gap: 7px; align-items: baseline; }
  /* the badge: a small link chip for the *other* kind */
  .badge { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--f-mono); padding: 4px 7px; border-radius: var(--r); border: 1px solid currentColor; text-decoration: none; white-space: nowrap; max-width: 100%; }
  .badge.pr { color: var(--pr); } .badge.issue { color: var(--issue); }
  .badge:hover { background: rgba(255,255,255,.06); }
  .badge .tt { color: var(--fg); font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
  .badge.wide { white-space: normal; }
  .prsub { display: grid; gap: 6px; margin-top: 2px; padding-top: 8px; border-top: 1px dashed var(--seam); }
  .prsub .r { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  /* switcher */
  .switch { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-radius: 999px; background: #fff; color: #111; font: 600 13px var(--f-body); box-shadow: 0 6px 24px #000a; z-index: 9; }
  .switch button { border: 0; background: #eee; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 15px; }
  .switch span { min-width: 220px; text-align: center; }
  .qnote { margin: 8px 0 18px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <p class="qnote" id="note"></p>
  <div id="out"></div>
</main>
<div class="switch"><button id="prev" aria-label="Previous variant">←</button><span id="label"></span><button id="next" aria-label="Next variant">→</button></div>

<script>
// ---- mock data: the four shapes the board must show. Reasons are the dispatcher's one-liners. ----
const R = "acme/widgets";
const MOCK = {
  review: [ // Waiting for human: PRs that are green and need review
    { issue: { n: 101, title: "Retry flaky fetches with backoff", tier: "sonnet" }, prs: [{ n: 130, title: "Retry fetches with exponential backoff", check: "green" }], why: "green; waiting for your review" },
    { issue: { n: 102, title: "Split the parser into lexer and grammar", tier: "opus" }, prs: [
        { n: 131, title: "Extract lexer", check: "green" }, { n: 133, title: "Move grammar rules to their own module", check: "green" } ], why: "green; waiting for your review" },
    { issue: null, prs: [{ n: 134, title: "Bump typescript from 5.8.3 to 5.9.1", check: "green", bot: true }], why: "green; waiting for your review" },
  ],
  progress: [ // PR in progress, and an issue whose PR hasn't opened yet (Queue-like)
    { issue: { n: 103, title: "Rewrite the install docs", tier: "haiku" }, prs: [{ n: 135, title: "Rewrite install docs", check: "pending" }], why: "CI running" },
    { issue: { n: 104, title: "Cache the schema lookup", tier: "sonnet" }, prs: [{ n: 136, title: "Cache schema lookups", check: "red" }, { n: 137, title: "Cache schema lookups (retry)", check: "pending" }], why: "2 PRs; first one red" },
    { issue: { n: 105, title: "Support ESM-only consumers", tier: "sonnet" }, prs: [], why: "dispatched next" },
  ],
};
const P = { // Octicons 16px, inner paths
  issue: '<path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"/>',
  pr: '<path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"/>',
  green: '<path d="M8 16A8 8 0 1 1 8 0a8 8 0 0 1 0 16Zm3.78-9.72a.751.751 0 0 0-.018-1.042.751.751 0 0 0-1.042-.018L6.75 9.19 5.28 7.72a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042l2 2a.75.75 0 0 0 1.06 0Z"/>',
  red: '<path d="M2.343 13.657A8 8 0 1 1 13.658 2.343 8 8 0 0 1 2.343 13.657ZM6.03 4.97a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042L6.94 8 4.97 9.97a.749.749 0 0 0 .326 1.275.749.749 0 0 0 .734-.215L8 9.06l1.97 1.97a.749.749 0 0 0 1.275-.326.749.749 0 0 0-.215-.734L9.06 8l1.97-1.97a.749.749 0 0 0-.326-1.275.749.749 0 0 0-.734.215L8 6.94Z"/>',
  pending: '<path d="M8 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/>',
  bot: '<path d="M5.75 7.5a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5a.75.75 0 0 1 .75-.75Zm5.25.75a.75.75 0 0 0-1.5 0v1.5a.75.75 0 0 0 1.5 0v-1.5Z"/><path d="M6.25 0h2A.75.75 0 0 1 9 .75V3.5h3.25a2.25 2.25 0 0 1 2.25 2.25V8h.75a.75.75 0 0 1 0 1.5h-.75v2.75a2.25 2.25 0 0 1-2.25 2.25h-8.5a2.25 2.25 0 0 1-2.25-2.25V9.5H.75a.75.75 0 0 1 0-1.5h.75V5.75A2.25 2.25 0 0 1 3.75 3.5H7.5v-2H6.25a.75.75 0 0 1 0-1.5ZM3 5.75v6.5c0 .414.336.75.75.75h8.5a.75.75 0 0 0 .75-.75v-6.5a.75.75 0 0 0-.75-.75h-8.5a.75.75 0 0 0-.75.75Z"/>',
};
const ic = (n) => `<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${P[n]}</svg>`;
const url = (n, kind) => `https://github.com/${R}/${kind === "pr" ? "pull" : "issues"}/${n}`;
const repoChip = `<span class="chip repo" style="--repo:#7fb2ff">widgets</span>`;
const ref = (n) => `<span class="chip ref">#${n}</span>`;
const tier = (t) => t ? `<span class="chip tier">${t}</span>` : "";
const ck = (c) => `<span class="ck ${c}" title="CI ${c}">${ic(c)}${c}</span>`;
const bot = `<span class="chip sub">${ic("bot")} dependabot</span>`;
const a = (n, kd, title) => `<a class="t" href="${url(n, kd)}">${title}</a>`;
const prBadge = (p) => `<a class="badge pr" href="${url(p.n, "pr")}" title="${p.title}">${ic("pr")}#${p.n} ${ck(p.check)}</a>`;
const issueBadge = (i) => `<a class="badge issue wide" href="${url(i.n, "issue")}">${ic("issue")}#${i.n} <span class="tt">${i.title}</span></a>`;
const stripe = (g) => g.prs.some((p) => p.check === "red") ? "red" : g.prs.some((p) => p.check === "pending") ? "pending" : "green";

// ---- A: the issue always leads. 1:1 = PR as a small badge; several PRs = a sub-list; orphan PR = PR-led card. ----
const cardA = (g, stage) => {
  if (!g.issue) { const p = g.prs[0]; // orphan PR
    return `<article class="kc pr"><div class="row"><span class="k pr">${ic("pr")}PR</span>${repoChip}${ref(p.n)}${ck(p.check)}${p.bot ? bot : ""}</div>${a(p.n, "pr", p.title)}<span class="why">${g.why}</span></article>`; }
  const i = g.issue;
  const one = g.prs.length === 1, many = g.prs.length > 1;
  return `<article class="kc issue"><div class="row"><span class="k issue">${ic("issue")}Issue</span>${repoChip}${ref(i.n)}${tier(i.tier)}${one ? prBadge(g.prs[0]) : ""}</div>
    ${a(i.n, "issue", i.title)}
    ${many ? `<div class="prsub">${g.prs.map((p) => `<div class="r">${prBadge(p)}<span class="why">${p.title}</span></div>`).join("")}</div>` : ""}
    <span class="why">${g.why}</span></article>`;
};

// ---- B: the stage decides who leads. PR stages: PR-led cards (one per PR) with the issue as a badge. Issue stages: as A. ----
const cardB = (g, stage) => {
  if (stage === "queue" || !g.prs.length) return cardA(g, stage);
  return g.prs.map((p) => `<article class="kc pr"><div class="row"><span class="k pr">${ic("pr")}PR</span>${repoChip}${ref(p.n)}${ck(p.check)}${p.bot ? bot : ""}</div>
    ${a(p.n, "pr", p.title)}
    ${g.issue ? issueBadge(g.issue) : `<span class="none">no issue</span>`}
    <span class="why">${g.prs.length > 1 ? `1 of ${g.prs.length} PRs for #${g.issue.n} · ` : ""}${g.why}</span></article>`).join("");
};

const VARIANTS = {
  A: { name: "Issue always leads", card: cardA, note: "One card per issue. A 1:1 PR is a small badge (icon, number, CI) in the chip row; several PRs get a sub-list; a PR without an issue is a PR-led card." },
  B: { name: "Stage decides the lead", card: cardB, note: "In the PR stages the PR leads (its title, CI) and the parent issue is a badge underneath; one card per PR. In Queue the issue leads, as in A." },
};
const keys = Object.keys(VARIANTS);
const module = (id, name, hint, groups, v) => { const cards = groups.map((g) => v.card(g, id)); const n = cards.reduce((t, c) => t + (c.match(/<article/g) || []).length, 0); return `<section class="module m-${id}"><div class="module-head"><span class="led"></span><h2>${name}</h2><span class="hint">${hint}</span><span class="readout">${String(n).padStart(2, "0")}</span></div><div class="stack">${cards.join("")}</div></section>`; };

function show(k) {
  const v = VARIANTS[k];
  document.getElementById("label").textContent = `${k} (${v.name})`;
  document.getElementById("note").textContent = v.note;
  document.getElementById("out").innerHTML =
    `<div class="line">${module("waiting", "Waiting for human", "needs review", MOCK.review, v)}${module("pr", "PR in progress", "red first", MOCK.progress.filter((g) => g.prs.length), v)}${module("queue", "Queue", "in pickup order", MOCK.progress.filter((g) => !g.prs.length), v)}</div>`;
  const u = new URL(location.href); u.searchParams.set("variant", k); history.replaceState(null, "", u);
}
const cur = () => { const k = new URLSearchParams(location.search).get("variant"); return keys.includes(k) ? k : "A"; };
const go = (d) => show(keys[(keys.indexOf(cur()) + d + keys.length) % keys.length]);
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
addEventListener("keydown", (e) => { if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1); });
show(cur());
</script>
</body>
</html>
