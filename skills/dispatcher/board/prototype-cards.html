<!doctype html>
<!-- PROTOTYPE, throwaway. Question: how should the board show issues AND their PRs so the two are easy to tell apart?
     Three variants of the card layout, switchable with ?variant=A|B|C or the ←/→ keys. Mock data, no board.json.
     Open via any static server from this directory (or double-click: it only needs board.css). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board card prototype</title>
<link rel="stylesheet" href="board.css">
<style>
  body { padding-top: 24px; padding-bottom: 96px; }
  main { max-width: 1080px; margin: 0 auto; }
  :root { --issue: #6fd38a; --pr: #b99cff; }
  /* shared kind marks: issue = open circle, PR = filled square-ish merge mark */
  .k { display: inline-flex; align-items: center; gap: 5px; font: 700 11px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
  .k.issue { color: var(--issue); } .k.pr { color: var(--pr); }
  .k i { width: 10px; height: 10px; flex: none; display: inline-block; }
  .k.issue i { border: 2px solid currentColor; border-radius: 50%; }
  .k.pr i { background: currentColor; border-radius: 2px; transform: rotate(45deg) scale(.85); }
  .ck { font: 11px var(--f-mono); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .ck::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--l); box-shadow: 0 0 6px var(--l); }
  .ck.green { --l: var(--ok); } .ck.red { --l: var(--bad); } .ck.pending { --l: var(--lamp); }
  .none { color: var(--muted); font: italic 12px var(--f-body); }
  a.t { text-decoration: none; font-weight: 700; overflow-wrap: anywhere; } a.t:hover { text-decoration: underline; }
  .why { color: var(--muted); font-size: 13px; }

  /* ===== A: issue-led group. One card per issue; its PRs nest inside as rows. Orphan PR = card with a "no issue" header. ===== */
  .grp { position: relative; border: 1px solid #000; border-radius: 4px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--holo-dim); overflow: hidden; }
  .grp .head { padding: 10px 12px; display: grid; gap: 6px; border-left: 3px solid var(--issue); }
  .grp .head.orphan { border-left-color: var(--pr); }
  .grp .head .row, .grp .prrow .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grp .prrow { padding: 8px 12px 8px 22px; border-top: 1px dashed var(--seam); border-left: 3px solid var(--pr); background: rgba(185,156,255,.05); display: grid; gap: 4px; }
  .grp .prrow::before { content: "↳"; position: absolute; left: 9px; color: var(--muted); }
  .grp .prrow { position: relative; }

  /* ===== B: two-lane ledger. Left lane issues, right lane PRs, one row per issue; PRs stack in the right lane. ===== */
  .ledger { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0,1fr) 28px minmax(0,1.1fr); gap: 0 0; align-items: stretch; }
  .ledger .lh { font: 700 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 4px 6px; }
  .ledger .cell { background: var(--glass); border: 1px solid #000; padding: 9px 12px; display: grid; gap: 5px; align-content: start; margin-bottom: 8px; }
  .ledger .cell.i { border-left: 3px solid var(--issue); border-radius: 18px 4px 4px 18px; }
  .ledger .cell.p { border-left: 3px solid var(--pr); border-radius: 4px; margin-bottom: 6px; }
  .ledger .cell.void { background: transparent; border: 1px dashed var(--seam); color: var(--muted); font: italic 12px var(--f-body); }
  .ledger .gap { display: grid; place-items: center; color: var(--muted); margin-bottom: 8px; }
  .ledger .rt { display: grid; align-content: start; margin-bottom: 2px; }
  .ledger .rt .cell:last-child { margin-bottom: 8px; }
  .ledger .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 700px) { .ledger { grid-template-columns: 1fr; } .ledger .gap { display: none; } .ledger .lh { display: none; } }

  /* ===== C: separate cards, tinted by kind, joined by a "closes" tie. Closest to today. Issue cards get a rounded left cap, PR cards a square one. ===== */
  .kc { position: relative; padding: 10px 12px 10px 16px; display: grid; gap: 6px; align-content: start; border: 1px solid #000; background: var(--glass); }
  .kc.issue { border-radius: 14px 4px 4px 14px; background: linear-gradient(90deg, rgba(111,211,138,.10), transparent 40%), var(--glass); box-shadow: inset 3px 0 0 var(--issue); }
  .kc.pr { border-radius: 4px; background: linear-gradient(90deg, rgba(185,156,255,.12), transparent 40%), var(--glass); box-shadow: inset 3px 0 0 var(--pr); }
  .kc .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tie { font: 11px var(--f-mono); color: var(--muted); }
  .tie b { color: var(--fg); font-weight: 600; }
  .kc.pr.child { margin-left: 18px; }
  .kc.pr.child::before { content: ""; position: absolute; left: -12px; top: -12px; bottom: 50%; width: 10px; border-left: 2px solid var(--seam); border-bottom: 2px solid var(--seam); border-bottom-left-radius: 6px; }
  .cluster { display: grid; gap: 6px; align-content: start; }

  /* switcher */
  .switch { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-radius: 999px; background: #fff; color: #111; font: 600 13px var(--f-body); box-shadow: 0 6px 24px #000a; z-index: 9; }
  .switch button { border: 0; background: #eee; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 15px; }
  .switch span { min-width: 220px; text-align: center; }
  .qnote { margin: 8px 0 18px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <p class="qnote" id="note"></p>
  <div id="out"></div>
</main>
<div class="switch"><button id="prev" aria-label="Previous variant">←</button><span id="label"></span><button id="next" aria-label="Next variant">→</button></div>

<script>
// ---- mock data: the four shapes the board must show. Reasons are the dispatcher's one-liners. ----
const R = "acme/widgets";
const MOCK = {
  review: [ // Waiting for human: PRs that are green and need review
    { issue: { n: 101, title: "Retry flaky fetches with backoff", tier: "sonnet" }, prs: [{ n: 130, title: "Retry fetches with exponential backoff", check: "green" }], why: "green; waiting for your review" },
    { issue: { n: 102, title: "Split the parser into lexer and grammar", tier: "opus" }, prs: [
        { n: 131, title: "Extract lexer", check: "green" }, { n: 133, title: "Move grammar rules to their own module", check: "green" } ], why: "green; waiting for your review" },
    { issue: null, prs: [{ n: 134, title: "Bump typescript from 5.8.3 to 5.9.1", check: "green", bot: true }], why: "green; waiting for your review" },
  ],
  progress: [ // PR in progress, and an issue whose PR hasn't opened yet (Queue-like)
    { issue: { n: 103, title: "Rewrite the install docs", tier: "haiku" }, prs: [{ n: 135, title: "Rewrite install docs", check: "pending" }], why: "CI running" },
    { issue: { n: 104, title: "Cache the schema lookup", tier: "sonnet" }, prs: [{ n: 136, title: "Cache schema lookups", check: "red" }, { n: 137, title: "Cache schema lookups (retry)", check: "pending" }], why: "2 PRs; first one red" },
    { issue: { n: 105, title: "Support ESM-only consumers", tier: "sonnet" }, prs: [], why: "dispatched next" },
  ],
};
const url = (n, kind) => `https://github.com/${R}/${kind === "pr" ? "pull" : "issues"}/${n}`;
const repoChip = `<span class="chip repo" style="--repo:#7fb2ff">widgets</span>`;
const kind = (k) => `<span class="k ${k}"><i></i>${k === "pr" ? "PR" : "Issue"}</span>`;
const ck = (c) => `<span class="ck ${c}">${c}</span>`;
const ref = (n) => `<span class="chip ref">#${n}</span>`;
const tier = (t) => t ? `<span class="chip tier">${t}</span>` : "";
const a = (n, kd, title) => `<a class="t" href="${url(n, kd)}">${title}</a>`;

// ---- variant A: issue-led group, PRs nested ----
const A = (g) => {
  const head = g.issue
    ? `<div class="head">${kind("issue")}${a(g.issue.n, "issue", g.issue.title)}<div class="row">${repoChip}${ref(g.issue.n)}${tier(g.issue.tier)}${g.prs.length > 1 ? `<span class="chip sub">${g.prs.length} PRs</span>` : ""}</div></div>`
    : `<div class="head orphan"><span class="none">No issue: opened without one</span></div>`;
  const prs = g.prs.map((p) => `<div class="prrow"><div class="row">${kind("pr")}${ref(p.n)}${ck(p.check)}${p.bot ? '<span class="chip sub">dependabot</span>' : ""}</div>${a(p.n, "pr", p.title)}</div>`).join("");
  const none = g.prs.length ? "" : `<div class="prrow"><span class="none">No PR yet</span></div>`;
  return `<article class="grp">${head}${prs}${none}<div class="head" style="border-left-color:transparent;padding-top:0"><span class="why">${g.why}</span></div></article>`;
};
const renderA = (gs) => `<div class="stack">${gs.map(A).join("")}</div>`;

// ---- variant B: two-lane ledger, issues left, PRs right ----
const renderB = (gs) => `<div class="stack"><div class="ledger">
  <div class="lh">Issues</div><div></div><div class="lh">Pull requests</div>
  ${gs.map((g) => `
    ${g.issue
      ? `<div class="cell i"><div class="row">${kind("issue")}${ref(g.issue.n)}${tier(g.issue.tier)}</div>${a(g.issue.n, "issue", g.issue.title)}<span class="why">${g.why}</span></div>`
      : `<div class="cell void">no issue</div>`}
    <div class="gap">${g.prs.length ? "→" : "·"}</div>
    <div class="rt">${g.prs.length
      ? g.prs.map((p) => `<div class="cell p"><div class="row">${kind("pr")}${ref(p.n)}${ck(p.check)}${p.bot ? '<span class="chip sub">dependabot</span>' : ""}</div>${a(p.n, "pr", p.title)}</div>`).join("")
      : `<div class="cell void">no PR yet</div>`}</div>`).join("")}
</div></div>`;

// ---- variant C: separate kind-tinted cards, PRs tied to their issue ----
const renderC = (gs) => `<div class="stack">${gs.map((g) => `<div class="cluster">
  ${g.issue ? `<article class="kc issue"><div class="row">${kind("issue")}${repoChip}${ref(g.issue.n)}${tier(g.issue.tier)}</div>${a(g.issue.n, "issue", g.issue.title)}${g.prs.length ? "" : `<span class="why">${g.why}</span>`}</article>` : ""}
  ${g.prs.map((p) => `<article class="kc pr${g.issue ? " child" : ""}"><div class="row">${kind("pr")}${g.issue ? "" : repoChip}${ref(p.n)}${ck(p.check)}${p.bot ? '<span class="chip sub">dependabot</span>' : ""}</div>${a(p.n, "pr", p.title)}<span class="tie">${g.issue ? `closes <b>#${g.issue.n}</b>` : "closes nothing"} · ${g.why}</span></article>`).join("")}
</div>`).join("")}</div>`;

const VARIANTS = {
  A: { name: "Issue group, PRs nested", fn: renderA, note: "One card per issue; its PRs sit inside as rows. A PR without an issue gets a card with a 'no issue' header." },
  B: { name: "Two lanes: issues | PRs", fn: renderB, note: "A ledger: issues in the left lane, PRs in the right. Multiple PRs stack beside their issue; gaps show as dashed 'no issue' / 'no PR yet'." },
  C: { name: "Separate cards, tied", fn: renderC, note: "Every issue and every PR is its own card, tinted and shaped by kind. PR cards hang off their issue with a 'closes #n' tie." },
};
const keys = Object.keys(VARIANTS);
const module = (id, name, hint, groups, v) => `<section class="module m-${id}"><div class="module-head"><span class="led"></span><h2>${name}</h2><span class="hint">${hint}</span><span class="readout">${String(groups.length).padStart(2, "0")}</span></div>${v.fn(groups)}</section>`;

function show(k) {
  const v = VARIANTS[k];
  document.getElementById("label").textContent = `${k} (${v.name})`;
  document.getElementById("note").textContent = v.note;
  document.getElementById("out").innerHTML =
    `<div class="line">${module("waiting", "Waiting for human", "needs review", MOCK.review, v)}${module("pr", "PR in progress", "red first", MOCK.progress, v)}</div>`;
  const u = new URL(location.href); u.searchParams.set("variant", k); history.replaceState(null, "", u);
}
const cur = () => { const k = new URLSearchParams(location.search).get("variant"); return keys.includes(k) ? k : "A"; };
const go = (d) => show(keys[(keys.indexOf(cur()) + d + keys.length) % keys.length]);
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
addEventListener("keydown", (e) => { if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1); });
show(cur());
</script>
</body>
</html>
