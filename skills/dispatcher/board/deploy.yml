# Deploys the workshop board after each dispatcher push. The dispatcher pushes this file
# with board.json to the workshop-board branch (dispatch.ts, pushBoard); it is not run
# from main. The deploy itself is main's .github/workflows/deploy-board.yml, which also
# runs when main changes the page and can be started by hand.
name: Deploy board

on:
  push:
    branches: [workshop-board]

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    uses: realJohnDoe/agent-skills/.github/workflows/deploy-board.yml@main
