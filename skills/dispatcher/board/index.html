<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joe's Workshop</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#181444">
<meta name="apple-mobile-web-app-title" content="Joe's Workshop">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="prototype-banner.css"><!-- PROTOTYPE -->
</head>
<body>
<header class="banner"><img src="banner.jpg" alt=""></header>
<div class="banner-title"><h1>Joe's Workshop</h1></div>
<p class="banner-sub">Every open issue and PR of the workshop, by stage. ✳ opens a Claude session.</p>
<main id="board"></main>
<script type="module">
import { render } from "./render.js";
import { loadBoard, mountBanner, mountSwitcher } from "./prototype-banner.js"; // PROTOTYPE
const main = document.getElementById("board");
const draw = async () => {
  const board = await loadBoard();
  main.innerHTML = render(board);
  mountBanner(board);
};
await draw();
mountSwitcher(draw);
</script>
</body>
</html>
