<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joe's Workshop</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#181444">
<meta name="apple-mobile-web-app-title" content="Joe's Workshop">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="board.css">
</head>
<body>
<header class="banner"><div class="art" id="art"><img src="banner.jpg" alt=""></div></header>
<div class="banner-title"><h1>Joe's Workshop</h1></div>
<p class="banner-sub">Every open issue and PR of the workshop, by stage. ✳ opens a Claude session.</p>
<main id="board"></main>
<script type="module">
import { moreLabel, render } from "./render.js";
import { scene } from "./components/scene.js";
const main = document.getElementById("board");
try {
  const res = await fetch("board.json", { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const board = await res.json();
  main.innerHTML = render(board);
  // Show more: reveal the next cards of its module and move focus to the first of them,
  // so keyboard and screen-reader users land on what appeared. The button goes once none are hidden.
  main.addEventListener("click", (e) => {
    const btn = e.target.closest("button.more");
    if (!btn) return;
    const step = Number(btn.dataset.step);
    const hidden = [...btn.closest(".module").querySelectorAll(".card[hidden]")];
    const shown = hidden.slice(0, step);
    shown.forEach((c) => c.removeAttribute("hidden"));
    const left = hidden.length - shown.length;
    if (left) btn.textContent = moreLabel(left, step);
    else btn.remove();
    shown[0]?.setAttribute("tabindex", "-1");
    shown[0]?.focus();
    room();
  });
  const motion = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  const art = document.getElementById("art");
  // The jump target: the module's top, less its scroll-margin-top (16px, board.css).
  const topOf = (el) => el.getBoundingClientRect().top + scrollY - parseFloat(getComputedStyle(el).scrollMarginTop);
  // Room to scroll: below the board, just enough space that the lowest stage a station links to
  // (the last one before Closed) can reach the top of the window. A short board in a tall
  // window would otherwise run out of page.
  const room = () => {
    main.style.paddingBottom = "";
    const lowest = [...main.querySelectorAll(".module:not(.m-closed)")].pop();
    if (!lowest) return;
    const short = innerHeight - (document.documentElement.scrollHeight - topOf(lowest));
    if (short > 0) main.style.paddingBottom = `${Math.ceil(short)}px`;
  };
  room();
  document.fonts.ready.then(room); // the fonts change the board's height
  addEventListener("resize", room);
  // A station scrolls its module to the top and flashes it. Scroll with window.scrollTo,
  // never scrollIntoView, and the page sets no smooth scroll-behavior in CSS: in the Claude
  // app's Android WebView (framed in the artifact viewer) either one makes a smooth scroll
  // that sometimes never starts. Issue #162 has the bisect.
  art.addEventListener("click", (e) => {
    const target = document.getElementById(e.target.closest("a.station")?.getAttribute("href").slice(1) ?? "");
    if (!target) return;
    e.preventDefault();
    scrollTo({ top: topOf(target), behavior: motion ? "smooth" : "auto" });
    target.classList.add("flash");
    setTimeout(() => target.classList.remove("flash"), 1400);
  });
  art.insertAdjacentHTML("beforeend", scene(board, motion));
  art.classList.add("live");
} catch (e) {
  main.innerHTML = `<p class="notice error">Couldn't load board.json (${String(e.message ?? e).replace(/[&<>]/g, "")}).</p>`;
}
</script>
</body>
</html>
