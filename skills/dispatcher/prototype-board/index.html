<!--
  PROTOTYPE, throw away. Answers wayfinder ticket realJohnDoe/agent-skills#63
  ("Board look and layout, prototyped on real dispatcher data") for the map #61.
  Round 2, after the maintainer's reaction to three variants: the vertical
  layout, Stuck and Waiting on top, then the rest in reverse happy-path order
  (Closed, After merge, PR in progress, Queue), no moving rail, a PR link on every issue card with a PR, the UI drawn as the control panel of a
  workshop/farm/spaceship (plants and robots belong in the banner image only),
  dark only, every chip rectangular, and needs-review PRs at the top of their stage.
  Real data: `node skills/dispatcher/scripts/dispatch.ts` dry run of 2026-11-17,
  which covered realJohnDoe/agent-skills only. Cards marked "sample" are made up;
  the button at the bottom hides them. Open the file in a browser; nothing to build.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a banner, a cockpit status strip, then one column of console modules in reverse happy-path
   order; Stuck is the alarm module at the top. */
:root {
  --sky-top: #1c1640;
  --sky-low: #5b3a86;
  --deck: #0e0c1d;          /* hull behind the modules */
  --metal: #1d1938;         /* module face */
  --metal-hi: #2c2652;      /* module bevel, light edge */
  --metal-lo: #0a0817;      /* module bevel, dark edge */
  --glass: #0c1424;         /* readout screen */
  --seam: #332c5e;
  --fg: #e9e6ff;
  --muted: #9a93c8;
  --holo: #5ee7f2;
  --holo-dim: rgba(94, 231, 242, .13);
  --lamp: #ffc36b;
  --ok: #6fd38a;
  --warn: #ffd34d;
  --bad: #ff5d76;
  --bad-dim: rgba(255, 93, 118, .12);
  --indigo: #9d8cff;
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 3px;                 /* the one radius for every chip */
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--deck); }
body {
  margin: 0; color: var(--fg);
  background:
    linear-gradient(var(--seam) 1px, transparent 1px) 0 0 / 100% 120px,
    var(--deck);
  font: 15px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
a { color: inherit; }
h1, h2 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
:focus-visible { outline: 2px solid var(--holo); outline-offset: 2px; }

/* ---------- banner: one 3:1 image, safe zone in the central half, CSS sky continues past its edges ---------- */
.banner {
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  position: relative; overflow: hidden;
  height: clamp(200px, 26vw, 340px);
  background: linear-gradient(180deg, var(--sky-top), var(--sky-low)); /* same colors as the image's sky */
  border-bottom: 3px solid var(--metal-hi);
}
.banner img {
  display: block; height: 100%; width: 100%; max-width: 1400px; margin: 0 auto;
  object-fit: cover; object-position: center bottom; /* crops come off the sky and the sides */
}
@media (min-width: 1401px) { /* wider than the image: its sides fade into the CSS sky */
  .banner img { -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
                mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
}
.banner-title { color: #fff; }
.banner-title h1 { font-size: clamp(26px, 4vw, 38px); letter-spacing: .03em; text-shadow: 0 2px 12px #0009; }
.banner-sub { max-width: 1080px; margin: 14px auto 0; color: var(--muted); }
@media (min-width: 601px) { /* wide: the title sits on the image's calm patch of sky, left of the safe zone */
  .banner-title { position: absolute; top: clamp(28px, 4.5vw, 64px);
    left: max(16px, env(safe-area-inset-left, 0px), calc(max(0px, (100vw - 1400px) / 2) + min(100vw, 1400px) * .04)); }
}
@media (max-width: 600px) { /* phone: the title moves below the image */
  .banner-title { padding: 16px 0 0; }
  .banner-title h1 { text-shadow: none; }
  .banner-sub { margin-top: 4px; }
}
.banner-debug { /* prototype only: what the crop is doing at this size */
  position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 8px;
  font: 11px system-ui, sans-serif; background: #111d; color: #fff; padding: 3px 8px; border-radius: 999px;
}

main { max-width: 1080px; margin: 0 auto; }

/* ---------- cockpit status strip ---------- */
.status {
  margin: 18px 0 22px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center;
  padding: 10px 14px; border-radius: 6px;
  background: var(--metal); border: 1px solid var(--metal-lo);
  box-shadow: inset 0 1px 0 var(--metal-hi);
  font: 12px var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase;
}
.status b { color: var(--fg); font-weight: 600; }
.status .sep { width: 1px; height: 14px; background: var(--seam); }

/* ---------- the line of modules ---------- */
.line { display: grid; gap: 22px; }

.module {
  position: relative; border-radius: 8px; padding: 0 0 14px;
  background: var(--metal);
  border: 1px solid var(--metal-lo);
  box-shadow: inset 0 1px 0 var(--metal-hi), 0 8px 20px #0006;
}
/* rivets in the four corners */
.module { background-image:
  radial-gradient(circle at 9px 9px, var(--metal-hi) 2px, transparent 2.5px),
  radial-gradient(circle at calc(100% - 9px) 9px, var(--metal-hi) 2px, transparent 2.5px),
  radial-gradient(circle at 9px calc(100% - 9px), var(--metal-hi) 2px, transparent 2.5px),
  radial-gradient(circle at calc(100% - 9px) calc(100% - 9px), var(--metal-hi) 2px, transparent 2.5px); }

.module-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 22px 10px 22px; border-bottom: 1px solid var(--metal-lo);
  box-shadow: 0 1px 0 var(--metal-hi);
}
.led { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 8px var(--c), inset 0 -2px 3px #0005; }
.module h2 { font-size: 16px; letter-spacing: .08em; text-transform: uppercase; }
.module .hint { font: 12px var(--f-mono); color: var(--muted); }
.readout { /* the count, as a recessed digital display */
  margin-left: auto; font: 600 15px var(--f-mono); color: var(--c); min-width: 3.2ch; text-align: right;
  padding: 2px 8px; border-radius: var(--r); background: var(--glass);
  box-shadow: inset 0 1px 3px #000c; text-shadow: 0 0 6px var(--c);
  font-variant-numeric: tabular-nums;
}
.module .stack { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; padding: 14px 22px 0; }

.m-stuck { --c: var(--bad); border-color: var(--bad); }
.m-stuck .module-head {
  background: repeating-linear-gradient(135deg, var(--bad-dim) 0 10px, transparent 10px 20px);
}
.m-stuck .led { animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.m-closed { --c: var(--ok); }
.m-afterMerge { --c: var(--lamp); }
.m-pr { --c: var(--holo); }
.m-queue { --c: var(--indigo); }
.m-waiting { --c: var(--warn); }

/* ---------- readout cards ---------- */
.card {
  position: relative; min-width: 0; display: grid; gap: 7px;
  padding: 10px 12px; border-radius: 4px;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
    var(--glass);
  border: 1px solid #000;
  box-shadow: inset 0 0 0 1px var(--holo-dim), inset 0 0 18px rgba(94, 231, 242, .05);
}
.card::before { /* the module's color as a thin lit edge */
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--c); box-shadow: 0 0 6px var(--c);
}
.card .title { font-weight: 700; line-height: 1.3; }
.card .title a { text-decoration: none; }
.card .title a:hover { text-decoration: underline; text-decoration-color: var(--holo); }
.card .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card .why { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.card.sample { border-style: dashed; border-color: var(--seam); }
.card.sample .title { padding-right: 54px; }
.card.sample::after {
  content: "sample"; position: absolute; top: 7px; right: 9px;
  font: 10px var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
}

/* every chip is the same rectangle; only its fill or outline changes */
.chip {
  font: 600 11px/1 var(--f-mono); padding: 4px 7px; border-radius: var(--r); letter-spacing: .03em;
  border: 1px solid transparent;
}
.chip.repo { color: var(--repo); border-color: currentColor; }
.chip.ref { color: var(--muted); padding-inline: 0; }
.chip.tier { background: var(--holo-dim); color: var(--holo); }
.chip.sub { background: var(--metal-hi); color: var(--fg); }
.chip.prlink { color: var(--holo); border-color: var(--holo); text-decoration: none; }
.chip.prlink:hover { background: var(--holo-dim); }
.chip.review { background: var(--warn); color: #241a00; }
.chip.auto { background: var(--ok); color: #062312; }
.check { display: inline-flex; align-items: center; gap: 5px; font: 11px var(--f-mono); color: var(--muted); }
.check::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--l); box-shadow: 0 0 6px var(--l); }
.check.green { --l: var(--ok); } .check.red { --l: var(--bad); } .check.pending { --l: var(--lamp); }

.empty { grid-column: 1 / -1; font: 12px var(--f-mono); color: var(--muted); padding: 4px 0; letter-spacing: .04em; text-transform: uppercase; }
.empty::before { content: "◦ "; color: var(--c); }

details.parked {
  margin-top: 22px; padding: 10px 16px; border-radius: 6px;
  background: var(--metal); border: 1px dashed var(--seam); color: var(--muted);
}
details.parked summary { cursor: pointer; font: 600 13px var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
details.parked ul { margin: 10px 0 2px; padding-left: 18px; }
details.parked li { margin: 4px 0; }
details.parked .chip.ref { padding: 0; }

@media (max-width: 560px) {
  .module-head, .module .stack { padding-inline: 12px; }
  .module .stack { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .m-stuck .led { animation: none; } }

/* ---------- prototype controls (not part of the design) ---------- */
.switcher {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 6px; align-items: center;
  background: #111; color: #fff; border: 2px solid #fff; border-radius: 999px;
  padding: 6px 8px; box-shadow: 0 6px 24px #0008; z-index: 50; font: 13px system-ui, sans-serif;
}
.switcher button { font: inherit; color: #fff; background: #333; border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.switcher button:hover { background: #555; }
</style>

<header class="banner">
  <img src="banner-placeholder.svg" alt="" id="banner-img">
  <div class="banner-debug" id="banner-debug"></div>
</header>
<div class="banner-title"><h1>Workshop board</h1></div>
<p class="banner-sub">Every open issue and PR of the workshop, by stage. Read-only: decide on the digest.</p>

<main>
  <div class="status" id="status"></div>
  <div class="line" id="line"></div>
  <div id="parked"></div>
</main>

<nav class="switcher" aria-label="Prototype controls">
  <button id="data"></button>
</nav>

<script>
// Prototype only: report how the 3:1 image is cropped at the current banner size.
function bannerDebug() {
  const b = document.querySelector(".banner"), W = Math.min(b.clientWidth, 1400), H = b.clientHeight;
  const ratio = W / H, out = document.getElementById("banner-debug");
  out.textContent = ratio >= 3
    ? `${b.clientWidth}×${H}px · ${b.clientWidth > 1400 ? "image 1400px, sides fade into the sky, " : "full width shown, "}top ${Math.round((1 - 3 / ratio) * 100)}% of the image cropped`
    : `${b.clientWidth}×${H}px · central ${Math.round((ratio / 3) * 100)}% of the width shown`;
}
addEventListener("resize", bannerDebug);
addEventListener("load", bannerDebug);

// REAL: dispatch.ts dry run, 2026-11-17, repos covered: realJohnDoe/agent-skills.
const GH = "https://github.com/";
const REAL = [
  { stage: "afterMerge", repo: "agent-skills", n: 49, kind: "issue", tier: "opus", pr: 56,
    title: "timetable: one routine and one schedule table in git for every workshop task",
    why: "Create the Timetable routine at claude.ai/code/scheduled" },
  { stage: "pr", repo: "agent-skills", n: 60, kind: "pr", check: "green", automerge: true,
    title: "surveys: list labels over REST, create survey labels on a repo's first run",
    why: "Green and quiet: merges on the next run" },
  { stage: "closed", repo: "agent-skills", n: 62, kind: "issue",
    title: "Can pushes to the workshop-board branch deploy GitHub Pages?", why: "Resolved" },
  { stage: "closed", repo: "agent-skills", n: 48, kind: "issue", tier: "sonnet", pr: 57,
    title: "dispatcher: an unpushable repo still gets the digest written, and only that repo is skipped", why: "Merged" },
  { stage: "closed", repo: "agent-skills", n: 55, kind: "issue", tier: "sonnet", pr: 58,
    title: "dispatcher: write the digest at the end of the run, after the sessions", why: "Merged" },
  { stage: "closed", repo: "agent-skills", n: 47, kind: "issue", tier: "sonnet", pr: 52,
    title: "dispatcher: move the digest out of dispatch.ts into digest.ts", why: "Merged" },
  { stage: "closed", repo: "agent-skills", n: 45, kind: "issue", tier: "sonnet", pr: 54,
    title: "dispatcher waits for GitHub to reflect a merge before re-reading", why: "Merged" },
  { stage: "parked", repo: "agent-skills", n: 66, title: "Slice the board build into tier-labelled issues", why: "no tier label" },
  { stage: "parked", repo: "agent-skills", n: 65, title: "Generate the board banner image", why: "no tier label" },
  { stage: "parked", repo: "agent-skills", n: 64, title: "Shape of board.json and where the site's source lives", why: "no tier label" },
  { stage: "parked", repo: "agent-skills", n: 50, tier: "sonnet", title: "timetable: move the digest's publish days from the dispatcher into the timetable", why: "blocked by agent-skills#49" },
];
// SAMPLE: invented cards for the other workshop repos, to judge density and repo tags.
const SAMPLE = [
  { stage: "waiting", repo: "meridian", n: 41, kind: "issue", tier: "opus", sub: "Decide",
    title: "Store recurring events as rules or as expanded rows?", why: "Rules (smaller) or rows (simpler queries)?" },
  { stage: "waiting", repo: "kenpo-notes", n: 18, kind: "issue", tier: "sonnet", sub: "Go ahead?",
    title: "Add a print stylesheet for the technique cards", why: "Unblocked, needs ready-for-agent" },
  { stage: "waiting", repo: "structra", n: 77, kind: "issue", tier: "haiku", sub: "Blocked",
    title: "Rename Node to Block in the public API", why: "Blocked by structra#75" },
  { stage: "queue", repo: "tracemap", n: 93, kind: "issue", tier: "sonnet",
    title: "Render step numbers inside the arrow heads", why: "Next up" },
  { stage: "queue", repo: "rentenluecke", n: 12, kind: "issue", tier: "haiku",
    title: "Round the gap to whole euros in the summary", why: "Second in line" },
  { stage: "queue", repo: "meridian", n: 39, kind: "issue", tier: "sonnet",
    title: "Show the week number in the month view", why: "Third in line" },
  { stage: "pr", repo: "structra", n: 80, kind: "pr", tier: "sonnet", check: "pending",
    title: "Validate schema references on load", why: "Waiting on CI" },
  { stage: "pr", repo: "kenpo-notes", n: 21, kind: "pr", check: "green", automerge: true,
    title: "Bump astro from 5.3.0 to 5.4.1", why: "Dependabot minor: merges on the next run" },
  { stage: "pr", repo: "tracemap", n: 95, kind: "pr", tier: "opus", check: "green",
    title: "Lay out traces with a force-directed pass", why: "Green and quiet" },
  { stage: "pr", repo: "meridian", n: 44, kind: "pr", tier: "sonnet", check: "red",
    title: "Sync calendars in the background", why: "Red: follow-up 1 of 2 runs today" },
  { stage: "pr", repo: "kenpo-notes", n: 22, kind: "pr", tier: "opus", check: "green",
    title: "Group techniques by belt on the index page", why: "Green and quiet" },
  { stage: "afterMerge", repo: "rentenluecke", n: 9, kind: "issue", tier: "sonnet", pr: 11,
    title: "Move the tax tables to 2027 values", why: "Check the 2027 numbers against the Bundesanzeiger" },
  { stage: "stuck", repo: "structra", n: 70, kind: "pr", tier: "opus", check: "red",
    title: "Incremental parser for large files", why: "Follow-up cap reached (2 of 2): still red" },
  { stage: "stuck", repo: "tracemap", n: 88, kind: "issue", tier: "sonnet",
    title: "Export traces as SVG sprites", why: "Dispatched 3 days ago, no PR yet" },
  { stage: "stuck", repo: "rentenluecke", kind: "repo",
    title: "Can't push to rentenluecke", why: "The Timetable routine has it attached read-only" },
  { stage: "closed", repo: "meridian", n: 37, kind: "issue", tier: "haiku", pr: 38, title: "Fix the off-by-one in the agenda end date", why: "Merged" },
  { stage: "parked", repo: "structra", n: 64, title: "Rewrite the CLI in Rust", why: "deferred" },
  { stage: "parked", repo: "meridian", n: 30, tier: "opus", title: "Design the sharing model", why: "plan" },
];
const REPO_COLORS = { "agent-skills": "#5ee7f2", meridian: "#b99cff", tracemap: "#ffc36b", structra: "#7fb2ff", "kenpo-notes": "#6fd38a", rentenluecke: "#ff9ec2" };

// What needs the maintainer first (Stuck, Waiting), then the happy path in reverse: latest wins back to the queue.
const STAGES = [
  { id: "stuck", name: "Stuck", hint: "off the line: needs a hand" },
  { id: "waiting", name: "Waiting", hint: "blocked, decide, go ahead" },
  { id: "closed", name: "Closed", hint: "latest 5" },
  { id: "afterMerge", name: "After merge", hint: "your step after the PR" },
  { id: "pr", name: "PR in progress", hint: "needs review first" },
  { id: "queue", name: "Queue", hint: "in pickup order" },
];
const EMPTY = { stuck: "All systems nominal", closed: "Nothing closed yet", afterMerge: "No after-merge steps", pr: "No open PRs", queue: "Queue empty", waiting: "Nothing waits on you" };

let dataMode = (() => { try { return localStorage.getItem("wb-data") || "sample"; } catch { return "sample"; } })();
const items = () => (dataMode === "real" ? REAL : REAL.concat(SAMPLE.map((x) => ({ ...x, sample: true }))));
const needsReview = (x) => x.kind === "pr" && x.check === "green" && !x.automerge;
// PR order: needs review, then red, then pending, then automerge.
const prRank = (x) => (needsReview(x) ? 0 : x.check === "red" ? 1 : x.check === "pending" ? 2 : 3);
function byStage(id) {
  const xs = items().filter((x) => x.stage === id);
  if (id === "pr") return xs.slice().sort((a, b) => prRank(a) - prRank(b));
  if (id === "closed") return xs.slice(0, 5);
  return xs;
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function card(x) {
  const url = x.n ? `${GH}realJohnDoe/${x.repo}/${x.kind === "pr" ? "pull" : "issues"}/${x.n}` : `${GH}realJohnDoe/${x.repo}`;
  const chips = [`<span class="chip repo" style="--repo:${REPO_COLORS[x.repo]}">${esc(x.repo)}</span>`];
  if (x.n) chips.push(`<span class="chip ref">#${x.n}</span>`);
  if (x.pr) chips.push(`<a class="chip prlink" href="${GH}realJohnDoe/${x.repo}/pull/${x.pr}" target="_blank" rel="noopener">PR #${x.pr}</a>`);
  if (x.tier) chips.push(`<span class="chip tier">${x.tier}</span>`);
  if (x.sub) chips.push(`<span class="chip sub">${esc(x.sub)}</span>`);
  if (needsReview(x)) chips.push(`<span class="chip review">needs review</span>`);
  if (x.automerge) chips.push(`<span class="chip auto">automerge</span>`);
  if (x.check) chips.push(`<span class="check ${x.check}">${x.check}</span>`);
  return `<article class="card${x.sample ? " sample" : ""}">
    <div class="title"><a href="${url}" target="_blank" rel="noopener">${esc(x.title)}</a></div>
    <div class="row">${chips.join("")}</div>
    <div class="why">${esc(x.why)}</div>
  </article>`;
}

function render() {
  const pad = (n) => String(n).padStart(2, "0");
  document.getElementById("line").innerHTML = STAGES.map((s) => {
    const xs = byStage(s.id);
    return `<section class="module m-${s.id}" aria-label="${s.name}">
      <div class="module-head"><span class="led"></span><h2>${s.name}</h2><span class="hint">${s.hint}</span><span class="readout">${pad(xs.length)}</span></div>
      <div class="stack">${xs.length ? xs.map(card).join("") : `<div class="empty">${EMPTY[s.id]}</div>`}</div>
    </section>`;
  }).join("");

  const parked = byStage("parked");
  document.getElementById("parked").innerHTML = parked.length ? `<details class="parked"><summary>${parked.length} parked: deferred, plan, no tier, blocked or assigned by hand</summary><ul>${parked
    .map((x) => `<li><a href="${GH}realJohnDoe/${x.repo}/issues/${x.n}" target="_blank" rel="noopener">${esc(x.repo)}#${x.n}</a> ${esc(x.title)} <span class="chip ref">(${esc(x.why)})</span></li>`)
    .join("")}</ul></details>` : "";

  const repos = new Set(items().map((x) => x.repo)).size;
  const n = (id) => byStage(id).length;
  document.getElementById("status").innerHTML = [
    `run <b>2026-11-17</b>`, `repos online <b>${repos}</b>`,
    `stuck <b style="color:var(--bad)">${n("stuck")}</b>`,
    `needs review <b style="color:var(--warn)">${items().filter(needsReview).length}</b>`,
    `waiting <b>${n("waiting")}</b>`, `in queue <b>${n("queue")}</b>`,
  ].join('<span class="sep"></span>');
  document.getElementById("data").textContent = dataMode === "real" ? "data: real only" : "data: real + samples";
}
document.getElementById("data").onclick = () => {
  dataMode = dataMode === "real" ? "sample" : "real";
  try { localStorage.setItem("wb-data", dataMode); } catch {}
  render();
};
render();
</script>
