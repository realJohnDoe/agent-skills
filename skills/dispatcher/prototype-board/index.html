<!--
  PROTOTYPE, throw away. Answers wayfinder ticket realJohnDoe/agent-skills#63
  ("Board look and layout, prototyped on real dispatcher data") for the map #61.
  Three structurally different variants of the workshop board, switchable from
  the floating bar at the bottom (or ← / →, or #a / #b / #c in the address).
  Two toggles on the bar: automerge as a chip or as its own stage, and real data
  only or real data plus sample cards for the other repos.
  Real data: `node skills/dispatcher/scripts/dispatch.ts` dry run of 2026-11-17,
  which covered realJohnDoe/agent-skills only. Cards marked "sample" are made up.
  Open the file in a browser; nothing to build.
-->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one deck header (sky band + station), then the variant's own layout of the stage line, Stuck kept apart. */
:root {
  /* dark-first: the dusk deck */
  --sky-top: #1c1640;      /* indigo night */
  --sky-low: #5b3a86;      /* purple dusk */
  --bg: #15122b;           /* deck floor */
  --panel: #211c3f;        /* console surface */
  --panel-2: #2a2450;
  --line: #3d3570;
  --fg: #ece8ff;
  --muted: #a49cd0;
  --holo: #5ee7f2;         /* cyan hologram */
  --holo-dim: rgba(94, 231, 242, .14);
  --lamp: #ffc36b;         /* warm lamp */
  --leaf: #6fd38a;         /* plants, success */
  --wood: #8a5a3b;
  --wood-hi: #b57b53;
  --warn: #ffd34d;         /* needs review */
  --bad: #ff6b81;          /* red checks, stuck */
  --bad-dim: rgba(255, 107, 129, .14);
  --robot: #f4f2ff;
  --eye: #3fb6ff;
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --sky-top: #7d6bd6; --sky-low: #f2b6c9;
    --bg: #f3f0fb; --panel: #ffffff; --panel-2: #f6f3ff; --line: #d9d2f2;
    --fg: #221c45; --muted: #625a8c;
    --holo: #0f8f9c; --holo-dim: rgba(15, 143, 156, .1);
    --lamp: #c47a12; --leaf: #23864a; --wood: #9b6644; --wood-hi: #c8936b;
    --warn: #a77800; --bad: #c42848; --bad-dim: rgba(196, 40, 72, .09);
    --robot: #ffffff; --eye: #1f7fd1;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --sky-top: #7d6bd6; --sky-low: #f2b6c9;
  --bg: #f3f0fb; --panel: #ffffff; --panel-2: #f6f3ff; --line: #d9d2f2;
  --fg: #221c45; --muted: #625a8c;
  --holo: #0f8f9c; --holo-dim: rgba(15, 143, 156, .1);
  --lamp: #c47a12; --leaf: #23864a; --wood: #9b6644; --wood-hi: #c8936b;
  --warn: #a77800; --bad: #c42848; --bad-dim: rgba(196, 40, 72, .09);
  --robot: #ffffff; --eye: #1f7fd1;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
a { color: inherit; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); }
:focus-visible { outline: 2px solid var(--holo); outline-offset: 2px; }

/* ---------- deck header (shared) ---------- */
.deck {
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 28px max(16px, env(safe-area-inset-left, 0px)) 22px;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-low));
  position: relative; overflow: hidden; color: #fff;
}
.deck svg.station { position: absolute; right: -40px; top: -30px; width: 360px; max-width: 70%; opacity: .55; pointer-events: none; }
.deck .stars { position: absolute; inset: 0; background-image:
  radial-gradient(1px 1px at 12% 20%, #fff8 50%, transparent 51%),
  radial-gradient(1px 1px at 34% 60%, #fff6 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 58% 18%, #fff9 50%, transparent 51%),
  radial-gradient(1px 1px at 72% 70%, #fff5 50%, transparent 51%),
  radial-gradient(1px 1px at 88% 40%, #fff7 50%, transparent 51%);
  pointer-events: none; }
.deck-inner { position: relative; max-width: 1280px; margin: 0 auto; display: flex; gap: 16px; align-items: end; flex-wrap: wrap; }
.deck h1 { font-size: clamp(26px, 4vw, 38px); letter-spacing: .02em; }
.deck p { margin: 4px 0 0; color: #ffffffcc; max-width: 60ch; }
.deck .meta { flex-basis: 100%; font: 12px/1.4 var(--f-mono); color: #ffffffb3; }
.banner-note { font: 11px var(--f-mono); color: #ffffff99; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }

main { max-width: 1280px; margin: 24px auto 0; }

/* ---------- cards & chips (shared look, each variant frames them) ---------- */
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; display: grid; gap: 6px; min-width: 0; position: relative;
}
.card .title { font-weight: 700; line-height: 1.3; }
.card .title a { text-decoration: none; }
.card .title a:hover { text-decoration: underline; text-decoration-color: var(--holo); }
.card .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card .why { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.card.sample { border-style: dashed; }
.card.sample .title { padding-right: 54px; }
.card.sample::after {
  content: "sample"; position: absolute; top: 6px; right: 8px;
  font: 10px var(--f-mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
}
.ref { font: 12px var(--f-mono); color: var(--muted); }
.tag { /* repo tag */
  font: 600 11px var(--f-mono); padding: 1px 7px; border-radius: 999px;
  border: 1px solid currentColor; color: var(--repo, var(--holo)); background: transparent;
}
.chip { font: 600 11px var(--f-mono); padding: 2px 8px; border-radius: 4px; letter-spacing: .03em; }
.chip.tier { background: var(--holo-dim); color: var(--holo); }
.chip.review { background: var(--warn); color: #241a00; }
.chip.auto { background: var(--leaf); color: #062312; }
.check { display: inline-flex; align-items: center; gap: 4px; font: 11px var(--f-mono); color: var(--muted); }
.check::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
.check.green { --c: var(--leaf); } .check.red { --c: var(--bad); } .check.pending { --c: var(--lamp); }
.empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 6px 2px; }
.count { font: 600 12px var(--f-mono); color: var(--holo); }
details.parked { margin-top: 28px; border-top: 1px dashed var(--line); padding-top: 12px; color: var(--muted); }
details.parked summary { cursor: pointer; font-family: var(--f-display); }
details.parked ul { margin: 8px 0 0; padding-left: 18px; }
details.parked li { margin: 4px 0; }

/* ---------- Variant A: conveyor ---------- */
.va .line { display: grid; grid-template-columns: repeat(var(--n), minmax(210px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.va .station { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; min-width: 0; }
.va .station-head { display: flex; align-items: center; gap: 8px; }
.va .station-head h2 { font-size: 16px; letter-spacing: .04em; text-transform: uppercase; }
.va .station-head svg { width: 28px; height: 32px; flex: none; }
.va .belt {
  height: 14px; border-radius: 7px; border: 1px solid var(--line);
  background: repeating-linear-gradient(90deg, var(--panel-2) 0 14px, var(--line) 14px 16px);
  background-size: 32px 100%; animation: belt 2.4s linear infinite;
}
@keyframes belt { to { background-position: 32px 0; } }
.va .stack { display: grid; gap: 10px; align-content: start; }
.va .card { border-top: 3px solid var(--holo); }
.va .bay {
  margin-top: 26px; border: 1px solid var(--bad); border-radius: 12px; padding: 14px;
  background: repeating-linear-gradient(135deg, var(--bad-dim) 0 12px, transparent 12px 24px);
}
.va .bay h2 { font-size: 16px; color: var(--bad); letter-spacing: .05em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.va .bay .stack { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-top: 10px; }
.va .bay .card { border-top-color: var(--bad); }

/* ---------- Variant B: flight path ---------- */
.vb { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.vb .route { position: relative; padding-left: 46px; }
.vb .route::before {
  content: ""; position: absolute; left: 16px; top: 10px; bottom: 10px; width: 2px;
  background: repeating-linear-gradient(180deg, var(--holo) 0 8px, transparent 8px 16px);
  opacity: .7;
}
.vb .wp { position: relative; padding-bottom: 26px; }
.vb .wp::before {
  content: ""; position: absolute; left: -38px; top: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--holo); box-shadow: 0 0 12px var(--holo);
}
.vb .wp.done::before { border-color: var(--leaf); box-shadow: 0 0 10px var(--leaf); }
.vb .wp h2 { font-size: 18px; display: flex; gap: 10px; align-items: baseline; }
.vb .wp h2 small { font: 12px var(--f-mono); color: var(--muted); font-weight: 400; }
.vb .wp .stack { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 10px; }
.vb .card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border-color: var(--holo-dim); }
.vb .drift { position: sticky; top: 16px; border-radius: 14px; padding: 14px; background: var(--panel); border: 1px solid var(--bad); }
.vb .drift h2 { font-size: 16px; color: var(--bad); }
.vb .drift p { margin: 4px 0 10px; color: var(--muted); font-size: 13px; }
.vb .drift .stack { display: grid; gap: 10px; }
.vb .drift .card { transform: rotate(var(--tilt, 0deg)); border-color: var(--bad-dim); }

/* ---------- Variant C: greenhouse ---------- */
.vc .beds { display: grid; gap: 18px; }
.vc .bed { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 14px; align-items: stretch; }
.vc .bed-label { display: grid; align-content: start; gap: 6px; padding-top: 6px; }
.vc .bed-label h2 { font-size: 17px; }
.vc .bed-label svg { width: 44px; height: 44px; }
.vc .soil {
  border-radius: 10px; padding: 12px 12px 22px; position: relative;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line);
}
.vc .soil::after { /* wooden bench edge */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; border-radius: 0 0 10px 10px;
  background: repeating-linear-gradient(90deg, var(--wood) 0 38px, var(--wood-hi) 38px 40px);
}
.vc .soil .stack { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.vc .card { border-left: 4px solid var(--leaf); }
.vc .sickbay { margin-bottom: 22px; border-radius: 12px; padding: 12px 14px; background: var(--bad-dim); border: 1px solid var(--bad); display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 14px; }
.vc .sickbay h2 { font-size: 17px; color: var(--bad); }
.vc .sickbay p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.vc .sickbay .stack { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.vc .sickbay .card { border-left-color: var(--bad); }

@media (max-width: 760px) {
  .vb { grid-template-columns: 1fr; }
  .vb .drift { position: static; order: -1; }
  .vc .bed, .vc .sickbay { grid-template-columns: 1fr; }
  .vc .bed-label { display: flex; align-items: center; gap: 10px; padding: 0; }
  .va .line { grid-template-columns: repeat(var(--n), minmax(240px, 82vw)); scroll-snap-type: x mandatory; }
  .va .station { scroll-snap-align: start; }
}
@media (prefers-reduced-motion: reduce) { .va .belt { animation: none; } }

/* ---------- prototype switcher (not part of the design) ---------- */
.switcher {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center;
  background: #111; color: #fff; border: 2px solid #fff; border-radius: 999px;

}
.switcher button { font: inherit; color: #fff; background: #333; border: 0; border-radius: 999px; padding: 5px 10px; cursor: pointer; }
.switcher button:hover { background: #555; }
.switcher .label { min-width: 150px; text-align: center; font-weight: 600; }

  { stage: "pr", repo: "meridian", n: 44, kind: "pr", tier: "sonnet", check: "red",
    title: "Sync calendars in the background", why: "Red: follow-up 1 of 2 runs today" },
  { stage: "afterMerge", repo: "rentenluecke", n: 9, kind: "issue", tier: "sonnet",
    title: "Move the tax tables to 2027 values", why: "Check the 2027 numbers against the Bundesanzeiger (merged in rentenluecke#11)" },
  { stage: "stuck", repo: "structra", n: 70, kind: "pr", tier: "opus", check: "red",
    title: "Incremental parser for large files", why: "Follow-up cap reached (2 of 2): still red" },
  { stage: "stuck", repo: "tracemap", n: 88, kind: "issue", tier: "sonnet",
    title: "Export traces as SVG sprites", why: "Dispatched 3 days ago, no PR yet" },
  { stage: "stuck", repo: "rentenluecke", kind: "repo",
    title: "Can't push to rentenluecke", why: "The Timetable routine has it attached read-only" },
  { stage: "closed", repo: "meridian", n: 37, kind: "issue", tier: "haiku", title: "Fix the off-by-one in the agenda end date", why: "Fixed by meridian#38" },
  { stage: "parked", repo: "structra", n: 64, title: "Rewrite the CLI in Rust", why: "deferred" },
  { stage: "parked", repo: "meridian", n: 30, tier: "opus", title: "Design the sharing model", why: "plan" },
];
const REPO_COLORS = { "agent-skills": "var(--holo)", meridian: "#b99cff", tracemap: "var(--lamp)", structra: "#7fb2ff", "kenpo-notes": "var(--leaf)", rentenluecke: "#ff9ec2" };

// ---------- state ----------
const VARIANTS = [
  { key: "a", name: "Conveyor deck", render: renderA },
  { key: "b", name: "Flight path", render: renderB },
  { key: "c", name: "Greenhouse rows", render: renderC },
];
const store = {
  get(k, d) { try { return localStorage.getItem("wb-" + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wb-" + k, v); } catch {} },
};
let amMode = store.get("am", "chip");      // chip | stage
let dataMode = store.get("data", "sample"); // real | sample
const variantIdx = () => Math.max(0, VARIANTS.findIndex((v) => "#" + v.key === location.hash));

function stages() {
  const s = [
    { id: "waiting", name: "Waiting", hint: "blocked, decide, go ahead" },
    { id: "queue", name: "Queue", hint: "in pickup order" },
    { id: "pr", name: "PR in progress", hint: "every open PR" },
  ];
  if (amMode === "stage") s.push({ id: "merging", name: "Merging", hint: "automerge, next run" });
  s.push({ id: "afterMerge", name: "After merge", hint: "your step after the PR" }, { id: "closed", name: "Closed", hint: "latest 5" });
  return s;
}
function items() {
  let all = dataMode === "real" ? REAL : REAL.concat(SAMPLE.map((x) => ({ ...x, sample: true })));
  return all.map((x) => (amMode === "stage" && x.stage === "pr" && x.automerge ? { ...x, stage: "merging" } : x));
}
const byStage = (id) => {
  const xs = items().filter((x) => x.stage === id);
  return id === "closed" ? xs.slice(0, 5) : xs;
};

// ---------- card ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function card(x) {
  const path = x.kind === "pr" ? "pull" : "issues";
  const url = x.n ? `${GH}realJohnDoe/${x.repo}/${path}/${x.n}` : `${GH}realJohnDoe/${x.repo}`;
  const chips = [];
  chips.push(`<span class="tag" style="--repo:${REPO_COLORS[x.repo] || "var(--holo)"}">${esc(x.repo)}</span>`);
  if (x.n) chips.push(`<span class="ref">#${x.n}</span>`);
  if (x.tier) chips.push(`<span class="chip tier">${x.tier}</span>`);
  if (x.check) chips.push(`<span class="check ${x.check}">${x.check}</span>`);
  if (x.kind === "pr" && x.check === "green" && !x.automerge && x.stage === "pr") chips.push(`<span class="chip review">needs review</span>`);
  if (x.automerge && amMode === "chip") chips.push(`<span class="chip auto">automerge</span>`);
  if (x.sub) chips.push(`<span class="chip tier" style="background:var(--panel-2);color:var(--fg)">${esc(x.sub)}</span>`);
  return `<article class="card${x.sample ? " sample" : ""}">
    <div class="title"><a href="${url}" target="_blank" rel="noopener">${esc(x.title)}</a></div>
    <div class="row">${chips.join("")}</div>
    <div class="why">${esc(x.why)}</div>
  </article>`;
}
const cards = (xs, emptyText) => xs.length ? xs.map(card).join("") : `<div class="empty">${emptyText}</div>`;
function parked() {
  const xs = byStage("parked");
  if (!xs.length) return "";
  return `<details class="parked"><summary>${xs.length} parked: deferred, plan, no tier, blocked or assigned by hand</summary><ul>${xs
    .map((x) => `<li><a href="${GH}realJohnDoe/${x.repo}/issues/${x.n}" target="_blank" rel="noopener">${esc(x.repo)}#${x.n}</a> ${esc(x.title)} <span class="ref">(${esc(x.why)})</span></li>`)
    .join("")}</ul></details>`;
}
const EMPTY = { waiting: "Nothing waits on you.", queue: "Queue empty: every ready issue is dispatched.", pr: "No open PRs.", merging: "Nothing to merge.", afterMerge: "No after-merge steps.", closed: "Nothing closed yet.", stuck: "Nothing stuck." };

// ---------- Variant A: conveyor deck ----------
function renderA() {
  const st = stages();
  const stuck = byStage("stuck");
  return `<div class="va">
    <div class="line" style="--n:${st.length}">
      ${st.map((s) => `<section class="station">
        <div class="station-head"><svg><use href="#robot"/></svg><div><h2>${s.name}</h2><div class="count">${byStage(s.id).length} · ${s.hint}</div></div></div>
        <div class="belt"></div>
        <div class="stack">${cards(byStage(s.id), EMPTY[s.id])}</div>
      </section>`).join("")}
    </div>
    <section class="bay"><h2>⚠ Repair bay: stuck <span class="count">${stuck.length}</span></h2>
      <div class="stack">${cards(stuck, EMPTY.stuck)}</div></section>
    ${parked()}
  </div>`;
}

// ---------- Variant B: flight path ----------
function renderB() {
  const st = stages();
  const stuck = byStage("stuck");
  const tilts = [-1.2, 0.8, -0.6, 1.1];
  return `<div class="vb">
    <div class="route">
      ${st.map((s) => `<section class="wp ${s.id === "closed" ? "done" : ""}">
        <h2>${s.name} <small>${byStage(s.id).length} · ${s.hint}</small></h2>
        <div class="stack">${cards(byStage(s.id), EMPTY[s.id])}</div>
      </section>`).join("")}
      ${parked()}
    </div>
    <aside class="drift"><h2>Off course: stuck (${stuck.length})</h2><p>Drifted off the route. Each needs a hand to get back on it.</p>
      <div class="stack">${stuck.map((x, i) => card(x).replace('<article class="card', `<article style="--tilt:${tilts[i % 4]}deg" class="card`)).join("") || `<div class="empty">${EMPTY.stuck}</div>`}</div>
    </aside>
  </div>`;
}

// ---------- Variant C: greenhouse rows ----------
function renderC() {
  const icon = { waiting: "seed", queue: "sprout", pr: "leafy", merging: "bloom", afterMerge: "bloom", closed: "crate" };
  const stuck = byStage("stuck");
  return `<div class="vc">
    <section class="sickbay"><div><h2>Sick bay: stuck (${stuck.length})</h2><p>Plants that stopped growing.</p><svg width="44" height="44"><use href="#wilt"/></svg></div>
      <div class="stack">${cards(stuck, EMPTY.stuck)}</div></section>
    <div class="beds">
      ${stages().map((s) => `<section class="bed">
        <div class="bed-label"><svg><use href="#${icon[s.id]}"/></svg><h2>${s.name}</h2><div class="count">${byStage(s.id).length} · ${s.hint}</div></div>
        <div class="soil"><div class="stack">${cards(byStage(s.id), EMPTY[s.id])}</div></div>
      </section>`).join("")}
    </div>
    ${parked()}
  </div>`;
}

// ---------- render + switcher ----------
function render() {
  const v = VARIANTS[variantIdx()];
  document.getElementById("board").innerHTML = v.render();
  document.getElementById("vlabel").textContent = `${v.key.toUpperCase()} (${v.name})`;
  document.getElementById("am").textContent = `automerge: ${amMode}`;
  document.getElementById("data").textContent = dataMode === "real" ? "data: real only" : "data: real + samples";
  const repos = dataMode === "real" ? "agent-skills" : "agent-skills + 5 sample repos";
  document.getElementById("meta").innerHTML = `dry run 2026-11-17<br>${repos}`;
}
function go(d) {
  const i = (variantIdx() + d + VARIANTS.length) % VARIANTS.length;
  location.hash = VARIANTS[i].key;
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.getElementById("am").onclick = () => { amMode = amMode === "chip" ? "stage" : "chip"; store.set("am", amMode); render(); };
document.getElementById("data").onclick = () => { dataMode = dataMode === "real" ? "sample" : "real"; store.set("data", dataMode); render(); };
document.getElementById("theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};
addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
addEventListener("hashchange", render);
render();
</script>
